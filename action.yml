name: skill-tripwire
description: Scan agent skill and config files for the shapes of poisoned instructions, fail-closed.
branding:
  icon: shield
  color: purple
inputs:
  paths:
    description: "Files or directories to scan, split on spaces, tabs or line ends; no shell expansion, so quotes, escapes, variables, ~, braces and globs are literal and a path holding a space cannot be named."
    required: false
    default: "."
  fail-on:
    description: Exit-code gate threshold - review or quarantine.
    required: false
    default: quarantine
runs:
  using: composite
  steps:
    # Inputs reach the shell only through env, never as an expression inside a run script, so
    # a crafted input is data to bash and never code (tests/test_action_inputs.py pins this).
    - name: Install skill-tripwire
      shell: bash
      env:
        TRIPWIRE_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$TRIPWIRE_ACTION_PATH"
    - name: Scan
      shell: bash
      env:
        TRIPWIRE_FAIL_ON: ${{ inputs.fail-on }}
        TRIPWIRE_PATHS: ${{ inputs.paths }}
      # Globbing off, the threshold checked first, then the shell's own word split (spaces, tabs
      # or line ends, nothing parsed again) and every path after the options.
      run: |
        set -f
        case "$TRIPWIRE_FAIL_ON" in
          review|quarantine) ;;
          *) echo "skill-tripwire: fail-on must be review or quarantine" >&2; exit 3 ;;
        esac
        tripwire_paths=($TRIPWIRE_PATHS)
        skill-tripwire scan --fail-on "$TRIPWIRE_FAIL_ON" -- "${tripwire_paths[@]}"
