name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scanner has no runtime dependencies. pytest is a test-time dependency, and
      # setup-python does not provide it: without this step the suite never collects and every
      # gate below is silently skipped.
      - name: Install the test harness
        run: python -m pip install "pytest>=7,<10"

      - name: Tests, including the wire-protocol, corpus-safety, and hygiene gates
        run: python -m pytest tests/ -q

      # The eval report is a claim about what the scanner detects. Regenerate it and fail the
      # build if the committed version no longer matches.
      - name: Regenerate the eval report
        run: python eval/run_eval.py --write

      - name: Fail if the eval report drifted
        run: git diff --exit-code -- eval/REPORT.md

      # The eval numbers are gated above; the integration surface was not. These three cheap
      # steps exercise the doors the README advertises, so they cannot break with a green build.
      - name: The package installs and its console scripts run (Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m pip install .
          skill-tripwire selftest
          skill-tripwire scan examples/poisoned-SKILL.md || test $? -eq 2

      - name: The composite Action scans this repo (Linux only)
        if: runner.os == 'Linux'
        uses: ./
        with:
          paths: examples
          fail-on: quarantine
        continue-on-error: true
